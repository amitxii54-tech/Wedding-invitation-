<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0506">
<meta name="description" content="The wedding of Aarav & Riya — 22–25 November 2026, Udaipur.">
<title>Aarav & Riya — Wedding Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0506;--wine:#2a090e;--wine2:#4a1019;--gold:#c9a050;--gold2:#f3d9a0;--cream:#fbf1dc;--muted:#cdb9a3;--line:rgba(243,217,160,.2);--serif:"Cormorant Garamond",Georgia,serif;--sans:Jost,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--cream);font:400 19px/1.65 var(--serif);overflow-x:hidden}
body.locked{overflow:hidden}a{color:inherit;text-decoration:none}button{font:inherit}
.wrap{width:min(1080px,90%);margin:auto}.sec{padding:120px 0;position:relative}
h1,h2,h3,p{margin-top:0}
h2{font:300 clamp(40px,7vw,76px)/1 var(--serif);margin:8px 0 22px;letter-spacing:-.01em}
h2 em,.names em{font-style:italic}
.foil{background:linear-gradient(100deg,#8a6a2c 0%,#f3d9a0 28%,#c9a050 48%,#fff1c8 64%,#9a7632 100%) 0 0/220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:foil 7s ease-in-out infinite alternate}
@keyframes foil{to{background-position:100% 0}}
.note{font:italic 300 22px var(--serif);color:var(--gold2)}
.small{font:400 11px/1.5 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--gold2)}
.lead{color:var(--muted);max-width:620px}
.orn{display:block;width:230px;height:24px;margin:26px auto;color:var(--gold)}
.btn{display:inline-block;padding:16px 34px;border:1px solid var(--gold);color:var(--ink);background:linear-gradient(135deg,#f3d9a0,#c9a050 55%,#9a7632);font:500 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:.4s;box-shadow:0 14px 40px rgba(201,160,80,.18)}
.btn:hover{transform:translateY(-3px);box-shadow:0 18px 50px rgba(201,160,80,.32)}
.btn.ghost{background:none;color:var(--gold2)}
:focus-visible{outline:2px solid var(--gold2);outline-offset:4px}
#bar{position:fixed;top:0;left:0;height:2px;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));z-index:9500}
#dust{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:.7}
main,footer{position:relative;z-index:2}
