<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#120b0a">
<meta name="description" content="Wedding invitation of Aarav &amp; Riya — 22–25 November 2026, Udaipur.">
<title>Aarav & Riya — Wedding Invitation</title>
<style>
:root{--bg:#120b0a;--cream:#fff7e8;--gold:#d8ad63;--gold2:#f1d08a;--rose:#9f4f50;--muted:#d8c8b6;--card:rgba(255,247,232,.065);--line:rgba(241,208,138,.18)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--cream);font-family:Georgia,"Times New Roman",serif;line-height:1.6;overflow-x:hidden}body.locked{overflow:hidden}button,a{font:inherit}a{color:inherit;text-decoration:none}.container{width:min(1100px,92%);margin:auto}.section{padding:105px 0;position:relative}.kicker{letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);font:600 10px/1.4 Arial,sans-serif}h1,h2,h3,p{margin-top:0}h2{font-size:clamp(38px,8vw,72px);font-weight:400;line-height:.98;margin:12px 0 22px}.lead{color:var(--muted);max-width:650px;font-size:17px}.gold{color:var(--gold2)}.btn{display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(241,208,138,.6);border-radius:999px;padding:14px 22px;color:#fff8e9;background:rgba(255,255,255,.035);cursor:pointer;transition:.3s}.btn:hover{background:rgba(216,173,99,.14);transform:translateY(-2px)}.gold-btn{background:linear-gradient(135deg,#e2bb70,#a97636);color:#160e09;border-color:#e2bb70;box-shadow:0 12px 35px rgba(216,173,99,.14)}.text-link{display:inline-block;color:var(--gold2);font:600 11px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:10px 0}.divider{width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:28px auto}.section-head{max-width:720px;margin-bottom:48px}.section-head .lead{margin-top:8px}
/* ENTRY: preserved reliable mechanism */
#entry{position:fixed;inset:0;z-index:99999;background:radial-gradient(circle at 50% 35%,rgba(216,173,99,.16),transparent 28%),linear-gradient(145deg,#090605,#1c0d0c 55%,#090605);display:flex;align-items:center;justify-content:center;text-align:center;transition:opacity .7s ease,visibility .7s ease,transform .7s ease}#entry.hide{opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.04)}.entry-inner{width:min(560px,88%);padding:30px}.mandala{width:190px;height:190px;border:1px solid rgba(241,208,138,.45);border-radius:50%;margin:0 auto 28px;position:relative;animation:spin 28s linear infinite}.mandala:before,.mandala:after{content:"";position:absolute;inset:18px;border:1px dashed rgba(241,208,138,.5);border-radius:50%}.mandala:after{inset:43px;box-shadow:0 0 0 1px rgba(241,208,138,.2),0 0 40px rgba(216,173,99,.12)}@keyframes spin{to{transform:rotate(360deg)}}.entry-names{font-size:clamp(44px,12vw,78px);line-height:.95;font-weight:400;margin:0}.entry-date{margin:24px 0 30px;color:var(--muted);letter-spacing:.16em;text-transform:uppercase;font:12px Arial,sans-serif}#enterBtn{border:1px solid var(--gold);background:linear-gradient(135deg,#d8ad63,#a97636);color:#160e09;border-radius:999px;padding:16px 30px;font:700 12px Arial,sans-serif;letter-spacing:.15em;cursor:pointer;box-shadow:0 10px 35px rgba(216,173,99,.2)}
/* nav */
.topnav{position:fixed;z-index:9000;top:0;left:0;right:0;padding:18px 5%;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(8,5,4,.7),transparent);pointer-events:none}.topnav>*{pointer-events:auto}.brand{width:38px;height:38px;border:1px solid rgba(241,208,138,.5);border-radius:50%;display:grid;place-items:center;color:var(--gold2);font-size:12px}.navlinks{display:flex;gap:22px;font:10px Arial,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#eadbc8}.navlinks a{opacity:.8}.navlinks a:hover{color:var(--gold2);opacity:1}
/* hero */
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:120px 0 70px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 32%,rgba(159,79,80,.22),transparent 35%),linear-gradient(180deg,#160c0b,#120b0a)}.hero-glow{position:absolute;width:280px;height:280px;border-radius:50%;filter:blur(60px);opacity:.13}.glow-a{background:#d8ad63;left:4%;top:20%}.glow-b{background:#9f4f50;right:2%;bottom:18%}.petal{position:absolute;color:rgba(241,208,138,.25);font-size:28px}.petal-a{top:25%;left:12%;animation:float 5s ease-in-out infinite}.petal-b{right:12%;top:38%;animation:float 6s ease-in-out infinite reverse}.petal-c{bottom:22%;left:18%;animation:float 7s ease-in-out infinite}@keyframes float{50%{transform:translateY(-16px) rotate(15deg)}}.hero-copy{position:relative;z-index:2}.cinematic-title{font-size:clamp(58px,14vw,125px);line-height:.82;font-weight:400;margin:18px 0 28px;letter-spacing:-.04em}.cinematic-title span{display:block;color:var(--gold2);font-size:.42em;margin:14px 0}.hero-rule{display:flex;align-items:center;justify-content:center;gap:15px;color:var(--gold2);font:11px Arial,sans-serif;letter-spacing:.15em}.hero-rule i{height:1px;width:55px;background:linear-gradient(90deg,transparent,var(--gold))}.hero-rule i:last-child{background:linear-gradient(90deg,var(--gold),transparent)}.hero-sub{color:var(--muted);font-size:18px;margin:22px 0 28px}.hero-actions{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}.hero-orbit{width:310px;height:310px;margin:55px auto 0;position:relative;display:grid;place-items:center}.orbit-ring{position:absolute;border:1px solid rgba(241,208,138,.22);border-radius:50%}.ring-one{inset:0;animation:spin 28s linear infinite}.ring-two{inset:25px;border-style:dashed;animation:spin 20s linear infinite reverse}.hero-monogram{width:135px;height:135px;border:1px solid rgba(241,208,138,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 0 70px rgba(216,173,99,.08)}.hero-monogram small{font-size:25px}.hero-monogram strong{font-size:18px;color:var(--gold2);font-weight:400}.orbit-dot{position:absolute;width:8px;height:8px;background:var(--gold2);border-radius:50%;box-shadow:0 0 18px var(--gold2)}.dot-one{top:18px;right:63px}.dot-two{bottom:55px;left:35px}.scroll{margin-top:40px;color:var(--gold2);font:9px Arial,sans-serif;letter-spacing:.25em;text-transform:uppercase}
/* welcome/couple */
.welcome{background:linear-gradient(180deg,#120b0a,#18100d)}.welcome-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.welcome-copy{border-left:1px solid var(--line);padding-left:35px}.quote{font-size:clamp(25px,4vw,42px);line-height:1.2;color:#fff4df;margin-bottom:20px}.welcome-copy p:not(.quote){color:var(--muted);max-width:540px}.couple-section{background:#15100e}.couple-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.person-card{display:grid;grid-template-columns:145px 1fr;gap:24px;align-items:center;border:1px solid var(--line);border-radius:25px;padding:18px;background:var(--card);transition:.35s}.person-card:hover{transform:translateY(-5px);border-color:rgba(241,208,138,.4)}.person-card h3{font-size:30px;font-weight:400;margin:7px 0}.person-card p{color:var(--muted);font-size:14px}.portrait{height:170px;border-radius:18px;display:grid;place-items:center;font-size:80px;color:rgba(255,247,232,.85);position:relative;overflow:hidden}.portrait:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.14),transparent 35%),linear-gradient(145deg,rgba(216,173,99,.28),rgba(159,79,80,.12))}.portrait span{position:relative;z-index:2}.portrait-a{background:linear-gradient(145deg,#3a2921,#18100d)}.portrait-b{background:linear-gradient(145deg,#3a2225,#17100e)}
/* story */
.story-feature{display:grid;grid-template-columns:250px 1fr;gap:60px;align-items:start}.story-stamp{width:210px;height:210px;border:1px solid var(--line);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:inset 0 0 0 14px rgba(216,173,99,.025)}.story-stamp span{font:10px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.story-stamp b{font-size:48px;font-weight:400;color:var(--gold2)}.story-stamp small{font:8px Arial,sans-serif;letter-spacing:.18em;color:var(--muted)}.timeline{position:relative}.timeline:before{content:"";position:absolute;left:13px;top:0;bottom:0;width:1px;background:var(--line)}.story{position:relative;display:grid;grid-template-columns:50px 1fr;gap:20px;padding:0 0 45px}.story:before{content:"";position:absolute;left:7px;top:5px;width:13px;height:13px;border-radius:50%;background:var(--gold2);box-shadow:0 0 0 6px rgba(216,173,99,.08)}.story-year{font:10px Arial,sans-serif;color:var(--gold2);padding-top:3px}.story h3{font-weight:400;font-size:28px;margin-bottom:6px}.story p{color:var(--muted);margin:0;max-width:600px}
/* events */
.events-section{background:linear-gradient(180deg,#120b0a,#17100d)}.event-list{display:grid;gap:12px}.event{border:1px solid var(--line);background:var(--card);padding:24px;border-radius:24px;display:grid;grid-template-columns:90px 1fr 35px;gap:20px;align-items:center;transition:.35s}.event:hover{transform:translateX(5px);border-color:rgba(241,208,138,.45);background:rgba(255,247,232,.085)}.event-feature{background:linear-gradient(90deg,rgba(216,173,99,.09),rgba(255,255,255,.035))}.event-date{border-right:1px solid var(--line);padding-right:20px;text-align:center}.event-date b{display:block;font-size:44px;line-height:.9;font-weight:400;color:var(--gold2)}.event-date span{font:9px Arial,sans-serif;letter-spacing:.18em;color:var(--muted)}.event-content .meta{font:10px Arial,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--gold2)}.event h3{font-size:32px;font-weight:400;margin:4px 0}.event p{color:var(--muted);margin:0 0 10px}.event-tag{font:9px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#d9c9b5}.event-arrow{font-size:22px;color:var(--gold2)}
/* countdown */
.countdown-section{background:#0e0908}.countdown-card{border:1px solid var(--line);border-radius:30px;padding:55px;display:grid;grid-template-columns:1fr 1.4fr;gap:35px;align-items:center;background:radial-gradient(circle at 20% 50%,rgba(159,79,80,.12),transparent 45%),rgba(255,255,255,.025)}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.time{border:1px solid var(--line);border-radius:18px;padding:20px 8px;text-align:center;background:rgba(255,255,255,.035)}.time b{display:block;font-size:38px;font-weight:400;color:var(--gold2)}.time span{font:9px Arial,sans-serif;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
/* gallery */
.gallery{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-top:40px}.photo{min-height:230px;border:0;padding:0;border-radius:20px;overflow:hidden;position:relative;background-size:cover;background-position:center;filter:saturate(.82);cursor:pointer}.photo:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.62));transition:.3s}.photo:hover:after{background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,0,0,.7))}.photo span{position:absolute;z-index:2;bottom:15px;left:15px;font:10px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:#fff}.photo.big{grid-row:span 2;min-height:470px}.p1{background-image:url("https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1000&q=85")}.p2{background-image:url("https://images.unsplash.com/photo-1465495976277-4387d4b0e4a6?auto=format&fit=crop&w=800&q=85")}.p3{background-image:url("https://images.unsplash.com/photo-1511285560929-80b456fea0bc?auto=format&fit=crop&w=800&q=85")}.p4{background-image:url("https://images.unsplash.com/photo-1519225421980-715cb0215aed?auto=format&fit=crop&w=800&q=85")}.p5{background-image:url("https://images.unsplash.com/photo-1519167758481-83f550bb49b3?auto=format&fit=crop&w=800&q=85")}
/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(7,4,3,.96);z-index:99998;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:25px;opacity:0;visibility:hidden;transition:.3s}.lightbox.open{opacity:1;visibility:visible}.lightbox-image{width:min(850px,92vw);height:min(70vh,650px);border-radius:20px;background-size:cover;background-position:center}.lightbox-caption{margin-top:15px;color:var(--gold2);font:11px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase}.lightbox button{position:absolute;top:18px;right:22px;background:none;border:0;color:#fff;font-size:38px;cursor:pointer}
/* venue */
.venue-section{background:#15100e}.venue-layout{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center}.venue-details{border-left:1px solid var(--line);padding-left:20px;margin:28px 0;display:grid;gap:5px;color:var(--muted)}.venue-details b{font-size:23px;color:var(--cream);font-weight:400}.venue-box{border:1px solid var(--line);border-radius:28px;overflow:hidden;background:var(--card)}.map{height:410px;position:relative;overflow:hidden;background:radial-gradient(circle at 35% 35%,rgba(216,173,99,.2),transparent 2%),linear-gradient(135deg,#17201c,#101713)}.map:before,.map:after{content:"";position:absolute;background:rgba(241,208,138,.18);height:2px;width:140%;left:-20%;transform:rotate(20deg);top:45%}.map:after{transform:rotate(-28deg);top:58%}.map-line{position:absolute;height:1px;background:rgba(216,173,99,.12);width:120%;left:-10%}.line-a{top:27%;transform:rotate(-8deg)}.line-b{top:74%;transform:rotate(14deg)}.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:42px;color:var(--gold2);text-shadow:0 0 25px rgba(216,173,99,.5)}.map-label{position:absolute;left:22px;bottom:20px;font-size:28px;color:rgba(255,247,232,.72);line-height:1}.map-label small{font:8px Arial,sans-serif;letter-spacing:.25em;color:var(--gold2)}
/* rsvp/footer */
.rsvp{text-align:center;background:radial-gradient(circle at 50% 50%,rgba(159,79,80,.18),transparent 50%)}form{max-width:560px;margin:30px auto 0;text-align:left}input,select{width:100%;margin:7px 0 12px;padding:15px 16px;border:1px solid rgba(241,208,138,.25);border-radius:13px;background:#1b110f;color:#fff7e8;outline:none}label{font:10px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}footer{padding:70px 0;text-align:center;border-top:1px solid rgba(241,208,138,.12);color:var(--muted)}.footer-names{font-size:42px;color:var(--cream);margin-bottom:8px}.footer-links{display:flex;justify-content:center;gap:22px;margin-top:25px;font:9px Arial,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:var(--gold2)}.reveal{opacity:0;transform:translateY(25px);transition:.8s ease}.reveal.show{opacity:1;transform:none}
